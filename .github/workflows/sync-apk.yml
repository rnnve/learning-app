name: Sync latest APK

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read

concurrency:
  group: sync-latest-apk
  cancel-in-progress: false

jobs:
  sync:
    if: vars.APK_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EAS_NO_VCS: '1'
      EAS_PROJECT_ROOT: ${{ github.workspace }}/frontend
      CDN_UPLOAD_URL: ${{ vars.CDN_UPLOAD_URL || 'https://cdn.rynni.cc/upload' }}
      CDN_UPLOAD_PATH: /apks/
      CDN_PUBLIC_BASE_URL: ${{ vars.CDN_PUBLIC_BASE_URL || 'https://cdn.rynni.cc' }}
      CDN_UPLOAD_KEY: ${{ secrets.CDN_UPLOAD_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Install project dependencies for Expo config plugins
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Check Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN" || { echo 'Set the EXPO_TOKEN repository secret first.'; exit 1; }
          test -n "$CDN_UPLOAD_KEY" || { echo 'Set the CDN_UPLOAD_KEY repository secret first.'; exit 1; }
      - uses: expo/expo-github-action@v8
        with:
          eas-version: '27.2.0'
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Find latest successful preview APK
        id: build
        working-directory: frontend
        run: |
          eas build:list --platform android --status finished --build-profile preview \
            --limit 10 --non-interactive --json > "$RUNNER_TEMP/apk-builds.json"
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0, '../tools')
          from sync_latest_apk import select_build
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'apk-builds.json')) as stream:
              build, _, _ = select_build(json.load(stream))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f"id={build['id']}\n")
          PY
      - name: Restore completed delivery record
        id: delivery-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/studyapp-apks/apk-sync-state.json
          key: cdn-apk-v2-${{ steps.build.outputs.id }}-${{ env.CDN_UPLOAD_URL }}-${{ env.CDN_PUBLIC_BASE_URL }}
      - name: Download, verify, and deliver
        run: |
          python tools/sync_latest_apk.py --build-json "$RUNNER_TEMP/apk-builds.json" \
            --output-dir "$RUNNER_TEMP/studyapp-apks" \
            --cdn-url "$CDN_UPLOAD_URL" --cdn-path "$CDN_UPLOAD_PATH" \
            --cdn-public-base-url "$CDN_PUBLIC_BASE_URL"
      - name: Save completed delivery record
        if: steps.delivery-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/studyapp-apks/apk-sync-state.json
          key: cdn-apk-v2-${{ steps.build.outputs.id }}-${{ env.CDN_UPLOAD_URL }}-${{ env.CDN_PUBLIC_BASE_URL }}
      - name: Show APK download link
        run: |
          python - <<'PY'
          import json, os
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'studyapp-apks', 'apk-sync-state.json')) as stream:
              state = json.load(stream)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(f"[Download APK {state['version']}]({state['cdnUrl']})\n\nSHA-256: `{state['sha256']}`\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: latest-apk-details
          path: ${{ runner.temp }}/studyapp-apks/apk-sync-state.json
